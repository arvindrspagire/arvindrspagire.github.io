bio:
  - en: "I am a Project Scientist-I in the HPC-AIML team at the Indian Institute of Tropical Meteorology (IITM), Pune. At present, I work on downscaling and on hybrid AI modelling. A hybrid model joins a physics-based weather model with machine learning (artificial intelligence, AI). I have more than five years of experience in weather science. My main research areas are short-range weather prediction and extreme rainfall events."
    mr: "मी भारतीय उष्णदेशीय हवामानशास्त्र संस्था (IITM), पुणे येथील HPC-AIML टीममध्ये प्रकल्प शास्त्रज्ञ-I म्हणून सध्या डाउनस्केलिंग आणि हायब्रिड AI मॉडेलिंगवर (भौतिकशास्त्रावर आधारित हवामान मॉडेल आणि कृत्रिम बुद्धिमत्ता/मशीन लर्निंग यांची सांगड) काम करत आहे. हवामान विज्ञानातील पाच वर्षांहून अधिक अनुभवासह अल्पकालीन हवामान अंदाज आणि अतिवृष्टीच्या घटना हे माझे प्रमुख अभ्यासविषय आहेत."
  - en: "I am doing a PhD in Atmospheric Science and Technology at Savitribai Phule Pune University. My thesis title is \"Extreme rainfall variability over India and its association with large-scale circulation\". On this site, I publish weather articles and daily weather alerts. I write the daily alerts in Marathi."
    mr: "सावित्रीबाई फुले पुणे विद्यापीठातून वातावरणशास्त्र व तंत्रज्ञान या विषयात माझे पीएच.डी. संशोधन सुरू आहे (प्रबंध: \"भारतातील अतिवृष्टीची परिवर्तनशीलता आणि तिचा मोठ्या प्रमाणावरील वातावरणीय अभिसरणाशी संबंध\"). या संकेतस्थळावर मी हवामानविषयक लेख आणि दैनंदिन हवामान इशारे मराठीत प्रसिद्ध करतो."

