bio:
  - en: "I work as a Project Scientist-I in the HPC-AIML team at the Indian Institute of Tropical Meteorology (IITM), Pune, on artificial-intelligence (AI) based weather prediction and hybrid modelling — combining physics-based weather models with machine learning. With more than five years of experience in weather science, my main research areas are short-range weather prediction and extreme rainfall events."
    mr: "मी भारतीय उष्णदेशीय हवामानशास्त्र संस्था (IITM), पुणे येथील HPC-AIML टीममध्ये प्रकल्प शास्त्रज्ञ-I म्हणून कृत्रिम बुद्धिमत्तेवर (AI) आधारित हवामान अंदाज आणि हायब्रिड मॉडेलिंगसाठी — भौतिकशास्त्रावर आधारित हवामान मॉडेल आणि मशीन लर्निंग यांची सांगड — कार्यरत आहे. हवामान विज्ञानातील पाच वर्षांहून अधिक अनुभवासह अल्पकालीन हवामान अंदाज आणि अतिवृष्टीच्या घटना हे माझे प्रमुख अभ्यासविषय आहेत."
  - en: "I am pursuing a PhD in Atmospheric Science and Technology at Savitribai Phule Pune University. On this site I publish weather articles and daily weather alerts (the daily alerts are written in Marathi)."
    mr: "सावित्रीबाई फुले पुणे विद्यापीठातून वातावरणशास्त्र व तंत्रज्ञान या विषयात माझे पीएच.डी. संशोधन सुरू आहे. या संकेतस्थळावर मी हवामानविषयक लेख आणि दैनंदिन हवामान इशारे मराठीत प्रसिद्ध करतो."

